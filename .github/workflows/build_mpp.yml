name: Build mpp

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the mpp as a GitHub release (tag v<version> from gradle.properties)'
        type: boolean
        default: false
  push:
    branches:
      - 'claude/**'

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build mpp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      # buildAndroid adds classes.dex to the mpp. Without it Morphe Manager on Android loads 0 patches.
      - name: Build with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean :patches:buildAndroid

      - name: Check mpp contains DEX
        run: |
          mpp=$(ls patches/build/libs/patches-*.mpp | grep -v -e '-javadoc' -e '-sources')
          unzip -l "$mpp" | grep -q ' classes.dex$'

      - name: Upload mpp
        uses: actions/upload-artifact@v4
        with:
          name: piko-mpp
          path: |
            patches/build/libs/patches-*.mpp
            !patches/build/libs/patches-*-javadoc.mpp
            !patches/build/libs/patches-*-sources.mpp
          if-no-files-found: error

  release:
    name: Release mpp
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download mpp
        uses: actions/download-artifact@v4
        with:
          name: piko-mpp
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version *= *//p' gradle.properties)
          gh release create "v$version" dist/*.mpp \
            --target "$GITHUB_SHA" \
            --title "Piko v$version" \
            --notes "Build of \`$GITHUB_SHA\` from run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
